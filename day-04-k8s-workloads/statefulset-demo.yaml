apiVersion: v1
kind: Service
metadata:
  name: demo
spec:
  clusterIP: None          # headless: gives each pod a stable DNS name
  selector:
    app: demo
  ports:
    - name: tcp
      port: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo
spec:
  serviceName: demo
  replicas: 3
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: main
          image: registry.access.redhat.com/ubi9/ubi-minimal
          command: ["sh", "-c", "echo \"started $(hostname) at $(date)\" >> /data/log.txt; sleep 36000"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
        # storageClassName: <set if your cluster has no default>
